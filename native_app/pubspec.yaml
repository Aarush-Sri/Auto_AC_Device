name: aura_climate
description: "Aura Smart Climate Control native application for iOS, Android, and Windows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  universal_ble: ^0.8.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_lucide: ^1.55.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
